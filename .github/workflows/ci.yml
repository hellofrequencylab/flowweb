# Minimal CI for FlowWeb Core. Every action is pinned by full commit SHA (tag in the comment,
# resolved with `git ls-remote` on 2026-11-09). CI never holds vendor API keys on agent branches.
name: ci
on:
  pull_request:
    # labeled/unlabeled so adding or removing the row label (or `bootstrap`) re-runs ledger-row.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Root scripts: `pnpm -r <script>` skips the workspace root, and the packages define no
      # lint/typecheck/test scripts of their own, so the -r form ran nothing.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm boundary
      - name: Tier 0 script self-tests
        run: node --test 'scripts/test/*.test.mjs'
      - name: Row definitions match the backlog
        run: node scripts/seed-rows.mjs --check
      - name: Bootstrap files agree (WS-P0-002)
        run: node scripts/check-bootstrap.mjs
      - name: c0/skeleton probe
        run: pnpm probe c0/skeleton

  schema-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --require-hashes --only-binary ':all:' -r tooling/requirements-ci.txt
      - run: python3 -I tests/schema_core_test.py
      - run: python3 -I contracts-core/validate.py
      - run: cd contracts-core/json-schema && sha256sum -c ../SCHEMA-SNAPSHOT.sha256

  tier0-guard:
    # An agent identity may not change Tier 0 paths. Human PRs touching them still need a code-owner
    # review (branch protection), which is the real enforcement. Agent logins beyond "*[bot]" are
    # listed in the repository variable FW_AGENT_LOGINS (comma-separated).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: node scripts/check-tier0.mjs
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FW_AGENT_LOGINS: ${{ vars.FW_AGENT_LOGINS }}

  probe-immutability:
    # WS-P0-004: probes and row definitions never change in a PR from an agent identity. A separate
    # job (not only a tier0-guard step) so branch protection can require it by name.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: node scripts/check-tier0.mjs --only probes/,ledger/rows/
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FW_AGENT_LOGINS: ${{ vars.FW_AGENT_LOGINS }}

  ledger-row:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: node scripts/check-pr-ledger.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the whole history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
      - name: Seeded fake key must be caught (fixture)
        # Assembled at run time so no key-shaped literal lives in this file.
        run: |
          d="$(mktemp -d)"
          printf 'const k = "sk-%s-api03-%s";\n' ant "$(printf 'FwCiFake0%.0s' 1 2 3 4 5 6 7 8)" > "$d/leak.ts"
          if gitleaks detect --no-git --source "$d" --config .gitleaks.toml --redact --no-banner; then
            echo "::error::gitleaks did not flag the seeded fake key"; exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Secret-scan probe (hook and config)
        run: node probes/c0/secret-scan.mjs

  # Added by later rows, not here: diff-policy (WS-P0-035), e2e with the fake vendor (WS-P0-042),
  # safety chaos suite (FW-C-016), a11y (FW-C-020).
